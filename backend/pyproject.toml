[project]
name = "weekfeed"
version = "0.1.0"
description = "Local standup drafter and personal knowledge base"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "openai>=1.60",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weekfeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
